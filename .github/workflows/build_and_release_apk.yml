name: Playbook LuX CI/CD & Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android APK (Debug)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package & Prepare APK
        run: |
          mkdir -p dist_apk
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} dist_apk/Playbook-LuX.apk \;
          cp dist_apk/Playbook-LuX.apk dist_apk/13_Playbook_LuX.apk
          ls -la dist_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Playbook-LuX-APK
          path: dist_apk/*.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-Playbook
          name: "⚡ Playbook LuX v1.0.0 · Lector y Audiolibros Inteligentes (Android APK)"
          draft: false
          prerelease: false
          body: |
            ### ⚡ Playbook LuX · Ecosistema KDF-LuX
            Compilado y firmado automáticamente con permisos desbloqueados (Batería 24/7, almacenamiento libre, ecualizador DSP y TTS offline).
            
            #### 🌟 Características integradas:
            - **Bóveda:** Audiolibros y Textos (EPUB, PDF, DOCX, TXT, HTML, MD) con exportación `.lux`.
            - **Reproductor:** ExoPlayer Media3, velocidad con pitch intacto (0.5x–3.0x), temporizador de sueño con fundido, visualizador PCM 24 barras.
            - **Traductor Offline:** ML Kit local sin consumo de datos ni conexión externa.
            - **Conversor TTS:** Lectura continua con normalización LUFS y exportación a Opus/OGG.
            - **Permisos Habilitados:** Exención de optimización de batería, lectura/escritura de archivos externos, control de audio y Bluetooth.
            
            #### 📥 Instalación:
            1. Descarga el archivo adjunto `Playbook-LuX.apk` en tu dispositivo.
            2. Ábrelo y pulsa "Instalar".
          files: |
            dist_apk/Playbook-LuX.apk
            dist_apk/13_Playbook_LuX.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
